name: Agent E-dziennika

on:
  schedule:
    - cron: '0 */3 * * 1-5' # Uruchamia się co 3 godziny od poniedziałku do piątku
  workflow_dispatch: # Pozwala uruchomić skrypt ręcznie przyciskiem

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        
    - name: Run Agent
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      run: |
        python agent.py
